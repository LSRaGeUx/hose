[build]
  # Regenerate the route tree rather than trusting the committed copy, so a
  # stale src/routeTree.gen.ts can never ship.
  command = "npm run generate-routes && vite build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
