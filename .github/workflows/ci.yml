name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders. Nothing in CI reaches a real database or the Anthropic API,
  # but the env contract in src/env.ts still has to be satisfied.
  DATABASE_URL: postgresql://hose:hose@localhost:5432/hose
  BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars
  BETTER_AUTH_URL: http://localhost:3100

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hose
          POSTGRES_PASSWORD: hose
          POSTGRES_DB: hose
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hose -d hose"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate route tree
        run: npm run generate-routes

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Migrate
        run: npm run db:migrate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
